<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Успешно потвърждение | Жизненост</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1E1E1E;
      border: 1.5px solid rgba(118, 192, 67, 0.35);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .icon-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: rgba(118, 192, 67, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      border: 1px solid #76C043;
    }
    .icon-circle svg {
      width: 42px;
      height: 42px;
      stroke: #76C043;
    }
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 26px;
      letter-spacing: 1.2px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #76C043;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    p {
      color: #B3B3B3;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background-color: #76C043;
      color: #000000;
      font-weight: 700;
      font-size: 15px;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="icon-circle">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </div>
  <h1>ЖИЗНЕНОСТ</h1>
  <div class="subtitle">Център за тренировки и възстановяване</div>
  <p>Вашият имейл адрес беше потвърден успешно!<br>Вече можете да влезете в мобилното приложение.</p>
  <a href="zhiznenost://" class="btn">Отвори приложението</a>
</div>
</body>
</html>
